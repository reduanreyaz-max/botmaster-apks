name: Build BOTMASTER User & Admin APKs
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build BOTMASTER User APK
        working-directory: apps/user-app
        run: |
          npm install && npm run build && npx cap add android && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build BOTMASTER Admin APK
        working-directory: apps/admin-app
        run: |
          npm install && npm run build && npx cap add android && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: botmaster-user-apk
          path: apps/user-app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: botmaster-admin-apk
          path: apps/admin-app/android/app/build/outputs/apk/debug/app-debug.apk
